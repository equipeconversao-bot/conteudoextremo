<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversão Extrema — Design System (React + Tailwind)</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Biblioteca de componentes React + Tailwind do design system da Conversão Extrema."
    />
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita flash)
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
